<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Lane Coffee POS</title>
<!-- Tailwind CSS via CDN for rapid mobile styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body {
    background-color: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* Custom scrollbar for horizontal bestsellers */
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
</head>
<body class="min-h-screen pb-24">

<div class="max-w-md mx-auto min-h-screen bg-[#161b22] border-x border-[#30363d] relative flex flex-col">

  <!-- Header & Sync Control Bar -->
  <header class="p-4 border-b border-[#30363d] bg-[#1c2128]">
    <div class="flex items-center justify-between mb-2">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-wider text-[#8b949e]">Manager.io POS</span>
        <h1 class="text-lg font-bold text-white">Harbour Lane Coffee</h1>
      </div>
      <button id="load-btn" onclick="loadPosData()" class="bg-[#238636] hover:bg-[#2ea043] text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all active:scale-95">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
        <span>Sync Ledger</span>
      </button>
    </div>

    <!-- Progress & Sync Status -->
    <div class="flex items-center gap-2">
      <div class="flex-1 bg-[#21262d] h-1.5 rounded-full overflow-hidden border border-[#30363d]">
        <div id="prog-bar" class="bg-[#238636] h-full w-0 transition-all duration-300"></div>
      </div>
      <span id="status-txt" class="text-[11px] text-[#8b949e] whitespace-nowrap">Tap Sync to load data</span>
    </div>
  </header>

  <!-- Main POS Screen Area -->
  <main class="p-4 flex-1 space-y-4">

    <!-- Step 1: Customer Selector -->
    <div class="bg-[#21262d] border border-[#30363d] p-3 rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="p-2 bg-[#1f6feb1a] text-[#58a6ff] rounded-lg border border-[#1f6feb33]">
          <i data-lucide="user" class="w-4 h-4"></i>
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-wider text-[#8b949e]">Active Customer</label>
          <select id="customer-select" class="bg-transparent text-sm font-semibold text-white focus:outline-none cursor-pointer">
            <option value="walk-in" class="bg-[#21262d] text-white">Walk-in Customer (Default)</option>
          </select>
        </div>
      </div>
      <span class="text-[10px] bg-[#23863626] text-[#3fb950] border border-[#2386364d] px-2 py-0.5 rounded-full font-bold">Auto</span>
    </div>

    <!-- Search Bar -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-[#8b949e] absolute left-3.5 top-3"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search inventory items..." 
        oninput="handleSearch(this.value)"
        class="w-full bg-[#21262d] border border-[#30363d] rounded-xl pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-[#58a6ff]"
      />
    </div>

    <!-- Step 2: Bestsellers Quick-Add Buttons -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-[#8b949e] uppercase tracking-wider">Top Items (Quick Add)</span>
        <span id="item-count" class="text-[10px] text-[#8b949e]">0 items</span>
      </div>
      <div id="bestsellers-grid" class="grid grid-cols-5 gap-1.5">
        <div class="col-span-5 text-center py-4 text-xs text-[#8b949e] bg-[#21262d] rounded-xl border border-dashed border-[#30363d]">
          Sync data to view inventory
        </div>
      </div>
    </div>

    <!-- Step 3: Current Order Cart List -->
    <div>
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-[#8b949e] uppercase tracking-wider">Current Cart</span>
        <button onclick="clearCart()" class="text-[11px] text-[#f85149] hover:underline font-semibold">Clear</button>
      </div>
      <div id="cart-container" class="bg-[#21262d] border border-[#30363d] rounded-xl p-4 min-h-[140px] flex flex-col justify-center items-center text-center">
        <i data-lucide="shopping-bag" class="w-8 h-8 text-[#8b949e] opacity-40 mb-2"></i>
        <p class="text-xs text-[#8b949e]">Your cart is empty.<br>Tap items above to add to sale.</p>
      </div>
    </div>

  </main>

  <!-- Step 4: Checkout Footer -->
  <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1c2128] border-t border-[#30363d] p-4 z-10">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs text-[#8b949e] font-medium">Total Amount</span>
      <span id="cart-total" class="text-2xl font-extrabold text-white">₱0.00</span>
    </div>
    <button id="checkout-btn" disabled onclick="alert('Ready for Step 4 API posting!')" class="w-full bg-[#238636] hover:bg-[#2ea043] disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
      <i data-lucide="credit-card" class="w-4 h-4"></i>
      <span>Pay & Create Invoice</span>
    </button>
  </footer>

</div>

<script>
/* ══════════════════════════════════
   postMessage helper — copied verbatim
══════════════════════════════════ */
function postMessageWithResponse(message) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error('Timeout — is this running inside Manager.io?'));
    }, 15000);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        resolve(event.data.body);
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════
   API Fetchers (Inventory & Customers)
══════════════════════════════════ */
async function fetchBatch(endpoint, onProgress) {
  const allItems = [];
  let nextToken = null;
  let pageNum = 0;
  let apiTotal = null;

  do {
    const path = nextToken
      ? `${endpoint}?PageSize=99999&next_page_token=${encodeURIComponent(nextToken)}`
      : `${endpoint}?PageSize=99999`;

    const data = await postMessageWithResponse({ type: 'api-request', method: 'GET', path });
    const page = Array.isArray(data) ? data : (data.items || data.data || []);
    allItems.push(...page);

    nextToken = data.next_page_token || data.nextPageToken || data._links?.next?.href || null;
    if (apiTotal === null) {
      apiTotal = data.totalCount ?? data.total ?? data.count ?? data._metadata?.totalCount ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum);
    if (pageNum >= 1000) break;
  } while (nextToken);

  return allItems;
}

/* ══════════════════════════════════
   POS Application State & Logic
══════════════════════════════════ */
let inventoryList = [];
let customerList = [];
let cart = [];

async function loadPosData() {
  const btn = document.getElementById('load-btn');
  const bar = document.getElementById('prog-bar');
  const status = document.getElementById('status-txt');

  btn.disabled = true;
  bar.style.width = '10%';
  status.textContent = 'Fetching Customers & Inventory…';

  try {
    // 1. Fetch Customers
    customerList = await fetchBatch('/api4/customer-batch');
    renderCustomerDropdown(customerList);
    bar.style.width = '50%';

    // 2. Fetch Inventory Items
    inventoryList = await fetchBatch('/api4/inventory-item-batch');
    bar.style.width = '100%';

    status.textContent = `✓ Synced (${inventoryList.length} items, ${customerList.length} customers)`;
    btn.disabled = false;

    renderBestsellers(inventoryList.slice(0, 5));
    document.getElementById('item-count').textContent = `${inventoryList.length} items`;

  } catch (err) {
    status.textContent = '⚠ ' + err.message;
    btn.disabled = false;
  }
}

function renderCustomerDropdown(customers) {
  const select = document.getElementById('customer-select');
  select.innerHTML = '<option value="walk-in" class="bg-[#21262d] text-white">Walk-in Customer (Default)</option>';

  customers.forEach((c) => {
    const item = c.item || c;
    if (!item.inactive) {
      const opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = item.name || item.nameWithCode || 'Unnamed Customer';
      opt.className = 'bg-[#21262d] text-white';
      select.appendChild(opt);
    }
  });
}

function renderBestsellers(items) {
  const container = document.getElementById('bestsellers-grid');
  if (!items || items.length === 0) {
    container.innerHTML = `<div class="col-span-5 text-center py-4 text-xs text-[#8b949e]">No items available</div>`;
    return;
  }

  container.innerHTML = items.map((rec) => {
    const item = rec.item || rec;
    const price = item.hasDefaultSalesUnitPrice ? item.defaultSalesUnitPrice : 0;
    const name = item.itemName || item.nameWithCode || 'Item';
    
    return `
      <button 
        onclick="addToCart('${rec.key}', '${escape(name)}', ${price})"
        class="bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] hover:border-[#58a6ff] p-2 rounded-xl text-center active:scale-95 transition-all flex flex-col justify-between items-center h-16"
      >
        <span class="text-[11px] font-bold text-white truncate w-full">${name}</span>
        <span class="text-[10px] font-bold text-[#3fb950]">₱${price.toFixed(2)}</span>
      </button>
    `;
  }).join('');
}

function handleSearch(query) {
  if (!query.trim()) {
    renderBestsellers(inventoryList.slice(0, 5));
    return;
  }
  const filtered = inventoryList.filter(i => {
    const name = (i.item?.itemName || i.item?.nameWithCode || '').toLowerCase();
    return name.includes(query.toLowerCase());
  }).slice(0, 5);
  renderBestsellers(filtered);
}

function addToCart(key, name, price) {
  const unescapedName = unescape(name);
  const existing = cart.find(i => i.key === key);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ key, name: unescapedName, price, qty: 1 });
  }
  renderCart();
}

function clearCart() {
  cart = [];
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cart-container');
  const totalEl = document.getElementById('cart-total');
  const checkoutBtn = document.getElementById('checkout-btn');

  const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  totalEl.textContent = `₱${total.toFixed(2)}`;

  if (cart.length === 0) {
    checkoutBtn.disabled = true;
    container.className = "bg-[#21262d] border border-[#30363d] rounded-xl p-4 min-h-[140px] flex flex-col justify-center items-center text-center";
    container.innerHTML = `
      <i data-lucide="shopping-bag" class="w-8 h-8 text-[#8b949e] opacity-40 mb-2"></i>
      <p class="text-xs text-[#8b949e]">Your cart is empty.<br>Tap items above to add to sale.</p>
    `;
    lucide.createIcons();
    return;
  }

  checkoutBtn.disabled = false;
  container.className = "bg-[#21262d] border border-[#30363d] rounded-xl divide-y divide-[#30363d] overflow-hidden";
  container.innerHTML = cart.map(i => `
    <div class="p-3 flex items-center justify-between text-xs">
      <div>
        <div class="font-bold text-white">${i.name}</div>
        <div class="text-[#8b949e]">₱${i.price.toFixed(2)} × ${i.qty}</div>
      </div>
      <div class="font-bold text-white">₱${(i.price * i.qty).toFixed(2)}</div>
    </div>
  `).join('');
}

// Initialize Lucide Icons
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
});
</script>
</body>
</html>
